name: Harvester

on:
  schedule:
    # Каждые 30 минут
    - cron: '*/30 * * * *'
  workflow_dispatch:   # Ручной запуск из GitHub UI

permissions:
  contents: write     # Для коммита обновлённых файлов

jobs:
  run:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install aiohttp

      - name: Download Xray
        shell: pwsh
        run: |
          $url = "https://github.com/XTLS/Xray-core/releases/latest/download/Xray-windows-64.zip"
          Write-Host "Downloading Xray from $url ..."
          Invoke-WebRequest -Uri $url -OutFile xray.zip
          Expand-Archive -Path xray.zip -DestinationPath bin -Force
          Remove-Item xray.zip -Force
          Write-Host "Xray ready:"
          Get-ChildItem bin

      - name: Run harvester
        run: python harvester.py

      - name: Commit updated assets
        shell: pwsh
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add assets/
          if (-not (git diff --cached --quiet)) {
            git commit -m "Update node lists [ci skip]"
            git push
          } else {
            Write-Host "No changes to commit"
          }
